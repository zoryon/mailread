name: mailread

services:
  backend:
    image: mailread-backend:latest
    build:
      context: .
      target: backend
    env_file:
      - ${DOCKER_BACKEND_ENV_FILE:-./backend/.env.backend.local}
    environment:
      EXTERNAL_DATABASE_REQUIRED: "true"
      PORT: "8000"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: mailread-frontend:latest
    build:
      context: .
      target: frontend
      args:
        NEXT_PUBLIC_FRONTEND_EMAIL_DOMAINS: ${FRONTEND_PUBLIC_EMAIL_DOMAINS:-zoryo.uk,gmail.com}
    environment:
      FRONTEND_SERVER_DJANGO_API_URL: ${FRONTEND_SERVER_DJANGO_API_URL:-http://backend:8000}
      FRONTEND_SERVER_JWT_ACCESS_SECONDS: ${FRONTEND_SERVER_JWT_ACCESS_SECONDS:-600}
      FRONTEND_SERVER_JWT_REFRESH_SECONDS: ${FRONTEND_SERVER_JWT_REFRESH_SECONDS:-604800}
      NEXT_PUBLIC_FRONTEND_EMAIL_DOMAINS: ${FRONTEND_PUBLIC_EMAIL_DOMAINS:-zoryo.uk,gmail.com}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
